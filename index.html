<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vextor | Trading Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="top-nav">
        <div class="nav-container">
            <h1>VEXTOR <span>QUANT</span></h1>
            <nav class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('dashboard')">
                    <i class="fa-solid fa-chart-line"></i> Dashboard
                </button>
                <button class="tab-btn" onclick="switchTab('calendario')">
                    <i class="fa-solid fa-calendar-days"></i> Calendario
                </button>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        
        <!-- VISTA 1: DASHBOARD -->
        <div id="view-dashboard" class="tab-content active">
            <section class="dashboard-kpis">
                <div class="kpi-card">
                    <h3>Beneficio Total</h3>
                    <p id="kpi-profit" class="kpi-value">$0.00</p>
                </div>
                <div class="kpi-card">
                    <h3>Win Rate</h3>
                    <p id="kpi-winrate" class="kpi-value">0%</p>
                </div>
                <div class="kpi-card">
                    <h3>Total Trades</h3>
                    <p id="kpi-trades" class="kpi-value">0</p>
                </div>
            </section>

            <section class="view-section" id="view-grafica">
                <h2>Rendimiento Histórico</h2>
                <div class="chart-container">
                    <canvas id="equityChart"></canvas>
                </div>
            </section>
        </div>

        <!-- VISTA 2: CALENDARIO -->
        <div id="view-calendario" class="tab-content">
            <section class="view-section">
                <div class="calendar-header">
                    <button id="btn-prev-month"><i class="fa-solid fa-chevron-left"></i></button>
                    <div class="mes-info">
                        <h2 id="mes-actual">Cargando...</h2>
                        <span id="mes-total-profit" class="mes-total">$0.00</span>
                    </div>
                    <button id="btn-next-month"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                
                <div class="calendar-wrapper">
                    <div class="calendar-grid">
                        <div class="day-name">Lun</div>
                        <div class="day-name">Mar</div>
                        <div class="day-name">Mié</div>
                        <div class="day-name">Jue</div>
                        <div class="day-name">Vie</div>
                        <div class="day-name">Sáb</div>
                        <div class="day-name">Dom</div>
                        <div class="day-name highlight-col">Total Sem</div>
                        
                        <div id="calendar-days-container" class="days-container" style="display: contents;"></div>
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- CONEXIÓN A FIREBASE Y CARGA DE DATOS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // PEGA AQUÍ TUS CREDENCIALES DE FIREBASE
        const firebaseConfig = {
  apiKey: "AIzaSyBhY_LqT0DXU9mI27VNrIZZVboOlNFQzSs",
  authDomain: "vextor-d627c.firebaseapp.com",
  projectId: "vextor-d627c",
  storageBucket: "vextor-d627c.firebasestorage.app",
  messagingSenderId: "158596639790",
  appId: "1:158596639790:web:88f98a25dba712a61783bf"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.cargarTradesDesdeFirebase = async function() {
            try {
                const docRef = doc(db, "vextor_data", "diario_personal");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists() && docSnap.data().trades) {
                    const tradesRemotos = docSnap.data().trades;
                    console.log("Trades cargados de Firebase:", tradesRemotos);
                    actualizarKPIs(tradesRemotos);
                    renderizarGrafica(tradesRemotos);
                    renderizarCalendario(tradesRemotos);
                } else {
                    console.log("No hay trades registrados todavía.");
                    actualizarKPIs([]);
                    renderizarGrafica([]);
                    renderizarCalendario([]);
                }
            } catch (error) {
                console.error("Error al obtener datos de Firebase:", error);
            }
        };

        // Ejecutar al cargar la página
        window.cargarTradesDesdeFirebase();
    </script>
    <script src="diario.js"></script>
</body>
</html>
